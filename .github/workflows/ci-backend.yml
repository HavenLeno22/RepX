name: CI — Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "shared/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/**"

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

